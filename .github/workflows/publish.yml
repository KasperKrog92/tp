# Dagligt datafeed til tp.kasper-krog.dk (TP-bilernes dagsplan).
#
# Kører i DETTE offentlige repo, fordi offentlige repos har gratis Actions-
# minutter (flyttet fra det private vagtplan-repo 25-11-2026, som Overbliks
# feed). Koden hentes fra vagtplan med læse-deploy-nøglen VAGTPLAN_DEPLOY_KEY;
# login til OnlinePlan kommer fra de krypterede secrets ONLINEPLAN_USER/
# ONLINEPLAN_PASS. Loggen er offentlig: scriptet logger aldrig login, kodeord,
# navne eller svarindhold, og GitHub maskerer desuden alle secret-værdier.
# Kun persondatafri TP-dagsfiler committes her.
#
# Kun schedule + workflow_dispatch — aldrig pull_request, så fremmede forks
# aldrig kan køre noget med disse secrets.
#
# Cron er UTC; TZ=Europe/Copenhagen sikrer at driftsdatoen (skifter kl. 04
# lokal) regnes rigtigt. Hver kørsel henter i dag og i morgen.
name: Publicér dagens TP-plan

on:
  schedule:
    # UTC: 04:25/05:25 og 12:05/13:05 dansk tid.
    - cron: "25 3 * * *"
    - cron: "5 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Europe/Copenhagen

# Kun én kørsel må publicere ad gangen (også ved manuel start).
concurrency:
  group: tp-publish
  cancel-in-progress: false

jobs:
  publiser:
    name: Publicér (forsøg 1/3)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Fejlen tolereres kun, fordi næste job prøver igen. Sidste forsøg
    # er obligatorisk, så et reelt udfald stadig giver en fejlnotifikation.
    continue-on-error: true
    outputs:
      publiceret: ${{ steps.faerdig.outputs.publiceret }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/publish
        with:
          vagtplan-key: ${{ secrets.VAGTPLAN_DEPLOY_KEY }}
          onlineplan-user: ${{ secrets.ONLINEPLAN_USER }}
          onlineplan-pass: ${{ secrets.ONLINEPLAN_PASS }}
      - id: faerdig
        name: Bekræft publicering
        run: echo "publiceret=true" >> "$GITHUB_OUTPUT"

  genforsoeg_2:
    name: Publicér (forsøg 2/3)
    needs: [publiser]
    if: ${{ !cancelled() && needs.publiser.outputs.publiceret != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    outputs:
      publiceret: ${{ steps.faerdig.outputs.publiceret }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/publish
        with:
          vagtplan-key: ${{ secrets.VAGTPLAN_DEPLOY_KEY }}
          onlineplan-user: ${{ secrets.ONLINEPLAN_USER }}
          onlineplan-pass: ${{ secrets.ONLINEPLAN_PASS }}
      - id: faerdig
        name: Bekræft publicering
        run: echo "publiceret=true" >> "$GITHUB_OUTPUT"

  genforsoeg_3:
    name: Publicér (forsøg 3/3)
    needs: [publiser, genforsoeg_2]
    if: ${{ !cancelled() && needs.publiser.outputs.publiceret != 'true' && needs.genforsoeg_2.outputs.publiceret != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/publish
        with:
          vagtplan-key: ${{ secrets.VAGTPLAN_DEPLOY_KEY }}
          onlineplan-user: ${{ secrets.ONLINEPLAN_USER }}
          onlineplan-pass: ${{ secrets.ONLINEPLAN_PASS }}
